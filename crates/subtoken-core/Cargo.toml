[package]
name = "subtoken-core"
description = "Static text embeddings from a model bundled at build time — the engine behind the subtoken DuckDB extension"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
model2vec-rs = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
# Loads a second copy of the bundled tokenizer, to answer "did `embed` lose any
# of this text" from the id lists either side of the cuts. See the comment on
# the workspace dependency.
tokenizers = { workspace = true }
