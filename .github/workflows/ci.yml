name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The DuckDB the SQL tests load the artifact into. The artifact declares a
  # v1.2.0 stable-ABI floor, so it is expected to load on anything from 1.2 up;
  # this is the version the gate actually exercises.
  DUCKDB_VERSION: v1.5.5

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            duckdb_asset: duckdb_cli-linux-amd64.zip
          - os: macos-latest
            duckdb_asset: duckdb_cli-osx-arm64.zip

    steps:
      # `submodules` for extension-ci-tools: the descriptor check validates
      # description.yml's platform names against that tree's
      # config/distribution_matrix.json, and without it that check goes quiet
      # rather than red.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Pinned rather than left to the runner image: the check scripts are
      # stdlib-only, but PyYAML has to be installed and a system python that is
      # externally managed refuses that.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Downloaded from the official release rather than a third-party setup
      # action: one fewer thing in the supply chain, and the version is visible
      # in this file.
      - name: Install the DuckDB CLI
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o duckdb_cli.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -o duckdb_cli.zip -d "${HOME}/.local/bin"
          chmod +x "${HOME}/.local/bin/duckdb"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Report the toolchain under test
        run: |
          rustc --version
          cargo --version
          duckdb --version
          duckdb -init /dev/null -noheader -csv -c "SELECT platform FROM pragma_platform();"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The model, the cache and the embedding contract. No DuckDB involved:
      # subtoken-core links none of it.
      - name: Rust tests
        run: cargo test --workspace

      - name: Build and package the extension
        run: make extension

      # AC2's other half. The self-test runs first so a checker that has stopped
      # matching anything is caught before its clean report is believed.
      - name: Nothing in the artifact can open a socket
        run: |
          python3 scripts/check_no_network_deps.py --self-test
          python3 scripts/check_no_network_deps.py --artifact build/subtoken.duckdb_extension

      # Each copy of a signature is another chance to be wrong, and the copy on
      # the registry page is the one a stranger reads before installing.
      - name: The documented surface matches the loaded catalog
        run: |
          python3 scripts/check_documented_surface.py --self-test
          python3 scripts/check_documented_surface.py --extension build/subtoken.duckdb_extension

      # LOAD the packaged artifact into a real DuckDB and query it.
      - name: SQL tests
        run: python3 scripts/run_sql_tests.py --extension build/subtoken.duckdb_extension

      # The registry's own doc_test job carries `if: false`, so nothing upstream
      # runs the examples description.yml publishes. This does, in one session,
      # against a real build.
      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      # --require-complete because this checkout IS recursive: here the
      # distribution matrix being absent means the submodule step broke, not
      # that someone cloned without it, and the platform-name and
      # inspection-coverage checks would otherwise report clean for having
      # nothing to read.
      - name: The registry entry's examples run, and it describes this tree
        run: |
          python3 scripts/check_description_examples.py --self-test
          python3 scripts/check_description_examples.py --extension build/subtoken.duckdb_extension --require-complete

      # The quality position, in the two files that publish it. Every figure a
      # stranger reads before installing has to be one somebody measured, the
      # registry page and README have to carry the same set, and a model bump
      # reddens rather than leaving them describing weights that are no longer
      # in the binary. The self-test runs first, for the same reason it does
      # above.
      - name: The two published pages agree about quality, and with the measurement
        run: |
          python3 scripts/check_quality_claims.py --self-test
          python3 scripts/check_quality_claims.py

      # Anchors only: this validates that every mutation in the table still
      # names a line that exists and applies none of them, which is seconds. The
      # sweep itself rebuilds the release cdylib per mutation and stays local.
      # `make mutation-check` was measured exiting 2 without running a single
      # mutation across three commits, unheard because nothing in CI asked.
      - name: The mutation table still points at code that exists
        run: python3 scripts/mutation_check.py --check-anchors

      # And the checks themselves: neuter one branch of a checked script at a
      # time and require the script to come back non-zero. It runs here rather
      # than staying local because it needs no build and no duckdb.
      #
      # What it reaches is `if`, `for` and `problems +=` in the functions each
      # target does not exclude — this script's own `main` among them, which was
      # excluded by name until the sweep was pointed at it and reported five of
      # its six sites deletable with every Python gate at exit 0. What it does
      # not reach is list content: an entry dropped from CLAIMS, PAGE_FIELDS,
      # BANNED_ON_PAGE or BANNED_IN_SECTION is not a branch. The script's
      # docstring names which of those are open and hands them to
      # scripts/mutation_check.py. Nor does it reach the marker that stops the
      # sweep re-entering itself or the group kill that bounds a hang: both are
      # expressions rather than branches, and the --self-test command in this
      # step is the only thing that reddens for either.
      - name: The branches this sweep enumerates redden when neutered
        run: |
          python3 scripts/check_assertions_can_fail.py --self-test
          python3 scripts/check_assertions_can_fail.py

      - name: Report the artifact size
        run: ls -l build/subtoken.duckdb_extension

  # The recipe duckdb/community-extensions runs, exercised here on every change
  # rather than only when the full distribution matrix runs. `make configure`
  # and `make release` are the targets the registry invokes; the checks after
  # them are run against the artifact THAT recipe produced, not the one `make
  # extension` produces, and `--compare` fails if the two stop agreeing.
  community-recipe:
    name: the registry's recipe on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            duckdb_asset: duckdb_cli-linux-amd64.zip
          - os: macos-latest
            duckdb_asset: duckdb_cli-osx-arm64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the DuckDB CLI
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o duckdb_cli.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}"
          unzip -o duckdb_cli.zip -d "${HOME}/.local/bin"
          chmod +x "${HOME}/.local/bin/duckdb"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      # `configure/` must not be tracked: extension-ci-tools writes
      # configure/extension_version.txt only when it is absent, so a tracked
      # copy is never refreshed and stamps a stale version onto every artifact
      # while every other gate stays green. This is the assertion that it has
      # not been added.
      - name: configure/ is not tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch configure > /dev/null 2>&1; then
            echo "configure/ is tracked. The upstream recipe writes" >&2
            echo "configure/extension_version.txt only when it is absent, so a tracked copy" >&2
            echo "is never refreshed and make release stamps a stale version." >&2
            git ls-files configure >&2
            exit 1
          fi
          echo "ok: git ls-files configure is empty"

      - name: make community-check
        run: make community-check PYTHON_BIN=python
